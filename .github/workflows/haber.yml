name: Çanakkale Anlık Haber Botu

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Kodu indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Kütüphaneleri yükle
        run: pip install -r requirements.txt

      - name: Playwright tarayıcısını kur
        run: playwright install chromium --with-deps || playwright install chromium

      - name: Fontu yükle
        run: sudo apt-get install -y fonts-dejavu-core

      - name: Botu çalıştır
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python main.py

      - name: Gönderilen haberleri kaydet
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "bot: sent_news.json guncellendi"
          file_pattern: sent_news.json